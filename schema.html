
<div style="padding: 1rem 0; font-family: var(--font-sans);">
  <div id="erd"></div>
</div>
<style>
#erd svg { max-width: 100%; }
</style>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a28' : '#f1efe8',
    primaryBorderColor: dark ? '#5f5e5a' : '#b4b2a9',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
    edgeLabelBackground: dark ? '#1e1e1c' : '#ffffff',
    attributeBackgroundColorEven: dark ? '#252523' : '#f8f7f2',
    attributeBackgroundColorOdd: dark ? '#1e1e1c' : '#ffffff',
  },
});

const diagram = `erDiagram
  USERS {
    uuid id PK
    string first_name
    string last_name
    string email UK
    string password_hash
    string phone
    enum role
    boolean is_verified
    boolean is_active
    timestamp created_at
    timestamp updated_at
  }

  ADDRESSES {
    uuid id PK
    uuid user_id FK
    string label
    string street_line1
    string street_line2
    string city
    string state
    string postal_code
    string country
    boolean is_default
  }

  CATEGORIES {
    uuid id PK
    uuid parent_id FK
    string name
    string slug UK
    string description
    string image_url
    boolean is_active
  }

  BRANDS {
    uuid id PK
    string name UK
    string logo_url
    string description
    boolean is_active
  }

  PRODUCTS {
    uuid id PK
    uuid category_id FK
    uuid brand_id FK
    string name
    string slug UK
    string description
    decimal base_price
    enum condition
    boolean is_active
    boolean is_featured
    timestamp created_at
  }

  PRODUCT_VARIANTS {
    uuid id PK
    uuid product_id FK
    string sku UK
    json attributes
    decimal price
    int stock_quantity
    int reserved_quantity
    boolean is_active
  }

  PRODUCT_IMAGES {
    uuid id PK
    uuid product_id FK
    string url
    string alt_text
    int sort_order
    boolean is_primary
  }

  INVENTORY_LOGS {
    uuid id PK
    uuid variant_id FK
    enum change_type
    int quantity_delta
    int quantity_after
    string reference_id
    string note
    timestamp created_at
  }

  ORDERS {
    uuid id PK
    uuid buyer_id FK
    uuid shipping_address_id FK
    string order_number UK
    enum status
    decimal subtotal
    decimal shipping_fee
    decimal tax
    decimal discount_amount
    decimal total
    timestamp placed_at
    timestamp updated_at
  }

  ORDER_ITEMS {
    uuid id PK
    uuid order_id FK
    uuid variant_id FK
    int quantity
    decimal unit_price
    decimal total_price
    json snapshot
  }

  SELLER_LISTINGS {
    uuid id PK
    uuid seller_id FK
    uuid variant_id FK
    decimal asking_price
    int quantity_available
    enum condition
    string description
    enum status
    timestamp created_at
    timestamp expires_at
  }

  PAYMENTS {
    uuid id PK
    uuid order_id FK
    enum method
    enum status
    decimal amount
    string gateway_ref
    string gateway_response
    timestamp initiated_at
    timestamp completed_at
  }

  REVIEWS {
    uuid id PK
    uuid product_id FK
    uuid user_id FK
    uuid order_item_id FK
    int rating
    string title
    text body
    boolean is_verified_purchase
    timestamp created_at
  }

  WISHLISTS {
    uuid id PK
    uuid user_id FK
    string name
    boolean is_public
    timestamp created_at
  }

  WISHLIST_ITEMS {
    uuid id PK
    uuid wishlist_id FK
    uuid variant_id FK
    timestamp added_at
  }

  COUPONS {
    uuid id PK
    string code UK
    enum discount_type
    decimal discount_value
    decimal min_order_value
    int max_uses
    int used_count
    timestamp valid_from
    timestamp valid_until
    boolean is_active
  }

  COUPON_USAGES {
    uuid id PK
    uuid coupon_id FK
    uuid user_id FK
    uuid order_id FK
    timestamp used_at
  }

  NOTIFICATIONS {
    uuid id PK
    uuid user_id FK
    enum type
    string title
    string message
    json metadata
    boolean is_read
    timestamp created_at
  }

  USERS ||--o{ ADDRESSES : "has"
  USERS ||--o{ ORDERS : "places"
  USERS ||--o{ SELLER_LISTINGS : "lists"
  USERS ||--o{ REVIEWS : "writes"
  USERS ||--o{ WISHLISTS : "owns"
  USERS ||--o{ COUPON_USAGES : "uses"
  USERS ||--o{ NOTIFICATIONS : "receives"

  CATEGORIES ||--o{ CATEGORIES : "parent of"
  CATEGORIES ||--o{ PRODUCTS : "groups"
  BRANDS ||--o{ PRODUCTS : "makes"

  PRODUCTS ||--o{ PRODUCT_VARIANTS : "has"
  PRODUCTS ||--o{ PRODUCT_IMAGES : "has"
  PRODUCTS ||--o{ REVIEWS : "receives"

  PRODUCT_VARIANTS ||--o{ ORDER_ITEMS : "in"
  PRODUCT_VARIANTS ||--o{ SELLER_LISTINGS : "listed as"
  PRODUCT_VARIANTS ||--o{ INVENTORY_LOGS : "tracked by"
  PRODUCT_VARIANTS ||--o{ WISHLIST_ITEMS : "saved in"

  ORDERS ||--|{ ORDER_ITEMS : "contains"
  ORDERS ||--o{ PAYMENTS : "paid via"
  ORDERS ||--o{ COUPON_USAGES : "applied to"
  ADDRESSES ||--o{ ORDERS : "ships to"

  WISHLISTS ||--|{ WISHLIST_ITEMS : "holds"
  COUPONS ||--o{ COUPON_USAGES : "tracked by"
  ORDER_ITEMS ||--o{ REVIEWS : "reviewed in"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
